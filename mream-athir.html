<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mream &amp; اثير</title>

<!-- Google Fonts: Amiri (Arabic) + Great Vibes (Latin script) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Great+Vibes&family=Cairo:wght@300;400;600&display=swap" rel="stylesheet">

<style>
  :root{
    --rose-deep:#e11d48;
    --rose-soft:#fbcfe8;
    --cream:#fff5f7;
    --gold:#c9973a;
  }

  *{ box-sizing:border-box; }

  html,body{
    height:100%;
    margin:0;
  }

  body{
    font-family:'Cairo', sans-serif;
    background:radial-gradient(circle at 50% 20%, #fff0f3 0%, var(--cream) 55%, #ffe4ec 100%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }

  /* Floating background hearts */
  .bg-heart{
    position:absolute;
    color:var(--rose-soft);
    opacity:.55;
    font-size:1.5rem;
    animation:floatUp linear infinite;
    pointer-events:none;
  }
  @keyframes floatUp{
    0%{ transform:translateY(10vh) scale(.8) rotate(0deg); opacity:0; }
    10%{ opacity:.6; }
    90%{ opacity:.4; }
    100%{ transform:translateY(-110vh) scale(1.1) rotate(15deg); opacity:0; }
  }

  .scene{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1.75rem;
    padding:2rem;
  }

  /* The heart itself */
  .heart{
    position:relative;
    width:min(78vw, 320px);
    height:min(78vw, 320px);
    animation:beat 1.6s ease-in-out infinite;
  }

  .heart svg{
    width:100%;
    height:100%;
    filter:drop-shadow(0 10px 25px rgba(225,29,72,.35));
  }

  @keyframes beat{
    0%, 100%{ transform:scale(1); }
    15%{ transform:scale(1.08); }
    30%{ transform:scale(0.98); }
    45%{ transform:scale(1.06); }
    60%{ transform:scale(1); }
  }

  .heart-names{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:.15rem;
    padding-bottom:8%;
  }

  .name-latin{
    font-family:'Great Vibes', cursive;
    font-size:clamp(1.6rem, 6vw, 2.6rem);
    color:#fff;
    text-shadow:0 2px 6px rgba(127,29,58,.55);
    line-height:1;
  }

  .heart-and{
    color:#ffe4ec;
    font-size:clamp(1rem, 3vw, 1.3rem);
    margin:.1rem 0;
  }

  .name-arabic{
    font-family:'Amiri', serif;
    font-weight:700;
    font-size:clamp(1.5rem, 6vw, 2.4rem);
    color:#fff;
    text-shadow:0 2px 6px rgba(127,29,58,.55);
    line-height:1.2;
  }

  .caption{
    font-family:'Amiri', serif;
    font-size:clamp(1.1rem, 3.2vw, 1.5rem);
    color:var(--rose-deep);
    text-align:center;
  }

  .subcaption{
    color:#9d174d;
    opacity:.75;
    font-size:.95rem;
    letter-spacing:.05em;
  }
</style>
</head>
<body>

  <div class="scene">
    <div class="heart">
      <svg viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff6b8a"/>
            <stop offset="55%" stop-color="#e11d48"/>
            <stop offset="100%" stop-color="#9d174d"/>
          </linearGradient>
        </defs>
        <path fill="url(#heartGradient)"
          d="M50 85
             L11 45
             C-3 30 -3 8 18 3
             C33 -1 45 8 50 20
             C55 8 67 -1 82 3
             C103 8 103 30 89 45
             Z"/>
      </svg>

      <div class="heart-names">
        <div class="name-latin">mream</div>
        <div class="heart-and">&#10084;</div>
        <div class="name-arabic">اثير</div>
      </div>
    </div>

    <p class="caption">قلبٌ واحدٌ يسع اسمين</p>
    <p class="subcaption">mream &amp; اثير</p>
  </div>

  <script>
    // Scatter small floating hearts across the background
    const body = document.body;
    const heartSymbols = ['&#10084;', '&#10084;&#65039;'];
    const total = 18;

    for (let i = 0; i < total; i++) {
      const el = document.createElement('div');
      el.className = 'bg-heart';
      el.innerHTML = Math.random() > 0.5 ? '&#10084;' : '&#10084;&#65039;';
      el.style.left = Math.random() * 100 + 'vw';
      el.style.fontSize = (0.9 + Math.random() * 1.6) + 'rem';
      el.style.animationDuration = (6 + Math.random() * 8) + 's';
      el.style.animationDelay = (Math.random() * 8) + 's';
      body.appendChild(el);
    }
  </script>

</body>
</html>
